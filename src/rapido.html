<title>Desaperto · Sua data</title>

<style>
/* Layout: uma coluna de leitura (máx. 34rem), cabeçalho com etapa e progresso, botão principal sempre ao fim da tela. Marca de cor única (papel claro), por decisão de identidade. */
:root {
  --papel: #F3EFE6;
  --tinta: #16211C;
  --verde: #16704A;
  --verde-escuro: #0F5537;
  --respiro: #DCEBE1;
  --areia: #E7DFD0;
  --ambar: #9A5B12;
  --cinza: #5C625E;
  --branco: #FFFFFF;
  --linha: #D9D1C1;
  --f-texto: 'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-num: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--papel); color: var(--tinta);
  font-family: var(--f-texto); font-size: 17px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 34rem; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; padding-block: 20px 28px; }
.topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.logo { height: 22px; width: auto; display: block; }
.voltar { appearance: none; border: 0; background: none; font: inherit; font-size: 15px; font-weight: 600; color: var(--tinta); padding: 10px 4px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; }
.voltar svg { width: 18px; height: 18px; }
.etapa { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.etapa-nome { font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--cinza); }
.barra { height: 6px; border-radius: 3px; background: var(--areia); overflow: hidden; }
.barra > i { display: block; height: 100%; background: var(--verde); border-radius: 3px; transition: width .35s ease; }
main { flex: 1; display: flex; flex-direction: column; padding-top: 26px; }
.tela { display: flex; flex-direction: column; gap: 22px; flex: 1; }
h1 { font-size: 30px; line-height: 1.12; font-weight: 800; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.lead { margin: 0; font-size: 17px; color: #2E3832; }
a.btn { text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
.acolhe { margin: 0; font-size: 15px; color: var(--verde); font-weight: 700; }
.texto p { margin: 0 0 14px; }
.texto p:last-child { margin-bottom: 0; }
.texto strong { font-weight: 800; }
.campos { display: flex; flex-direction: column; gap: 22px; }
.campo { display: flex; flex-direction: column; gap: 8px; }
.campo > label, .campo > .rotulo, fieldset legend { font-weight: 700; font-size: 17px; line-height: 1.3; padding: 0; }
.ajuda { font-size: 14px; color: var(--cinza); margin: -2px 0 0; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
fieldset legend { margin-bottom: 10px; }
input[type=text], input[type=email], input[inputmode], select, textarea {
  width: 100%; font: inherit; font-size: 18px; color: var(--tinta); background: var(--branco);
  border: 1.5px solid var(--linha); border-radius: 12px; padding: 13px 14px; min-height: 52px;
}
textarea { min-height: 96px; resize: vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--respiro); border-color: var(--verde); outline-offset: 0; }
.dinheiro { position: relative; }
.dinheiro span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-family: var(--f-num); font-weight: 600; font-size: 16px; color: var(--cinza); pointer-events: none; }
.dinheiro input { padding-left: 46px; font-family: var(--f-num); font-weight: 600; font-variant-numeric: tabular-nums; }
.curto { max-width: 9rem; }
.opcoes { display: flex; flex-direction: column; gap: 10px; }
.opcoes.lado { flex-direction: row; flex-wrap: wrap; }
.opcoes.lado .op { flex: 1 1 8rem; }
.op { position: relative; display: flex; }
.op input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.op span { flex: 1; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 12px 16px; border-radius: 12px; border: 1.5px solid var(--linha); background: var(--branco); font-size: 16px; font-weight: 600; line-height: 1.3; }
.op span::before { content: ""; flex: none; width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--linha); background: var(--branco); }
.op input[type=checkbox] + span::before { border-radius: 6px; }
.op input:checked + span { border-color: var(--verde); background: var(--respiro); }
.op input:checked + span::before { border-color: var(--verde); background: var(--verde); box-shadow: inset 0 0 0 3px var(--branco); }
.op input:focus-visible + span { outline: 3px solid var(--verde); outline-offset: 2px; }
.check { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; line-height: 1.45; cursor: pointer; }
.check input { width: 22px; height: 22px; margin: 1px 0 0; flex: none; accent-color: var(--verde); }
.nao-sei { display: inline-flex; gap: 10px; align-items: center; font-size: 15px; color: var(--cinza); cursor: pointer; min-height: 36px; }
.nao-sei input { width: 20px; height: 20px; accent-color: var(--verde); margin: 0; }
.linha-dupla { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.erro { color: var(--ambar); font-size: 14px; font-weight: 700; margin: 0; }
.campo.com-erro input, .campo.com-erro select, .campo.com-erro .op span { border-color: var(--ambar); }
.acoes { margin-top: auto; padding-top: 28px; display: flex; flex-direction: column; gap: 12px; }
.btn { appearance: none; border: 0; font: inherit; font-size: 17px; font-weight: 700; min-height: 56px; border-radius: 16px; padding: 0 22px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn-principal { background: var(--verde); color: var(--branco); }
.btn-principal:hover { background: var(--verde-escuro); }
.btn-sec { background: var(--branco); color: var(--tinta); border: 1.5px solid var(--linha); }
.btn:focus-visible, .voltar:focus-visible, .link:focus-visible { outline: 3px solid var(--tinta); outline-offset: 3px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.link { appearance: none; border: 0; background: none; font: inherit; font-size: 15px; font-weight: 700; color: var(--verde); padding: 8px 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; min-height: 40px; }
.nota { font-size: 14px; color: var(--cinza); text-align: center; margin: 0; }
.total { position: sticky; bottom: 0; margin-top: 8px; background: var(--tinta); color: var(--papel); border-radius: 14px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.total b { font-family: var(--f-num); font-size: 20px; font-variant-numeric: tabular-nums; }
.total small { font-size: 14px; }
.cartoes { display: flex; flex-direction: column; gap: 12px; }
.cartao { background: var(--branco); border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; border: 1.5px solid var(--areia); }
.cartao-topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.cartao h2 { font-size: 17px; margin: 0; line-height: 1.3; }
.cartao .quem { font-size: 14px; color: var(--cinza); margin: 2px 0 0; }
.cartao .valor { font-family: var(--f-num); font-weight: 600; font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip { display: inline-block; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--areia); color: var(--tinta); }
.chip.atraso { color: var(--ambar); }
.cartao-acoes { display: flex; gap: 18px; flex-wrap: wrap; }
.vazio { border: 1.5px dashed var(--linha); border-radius: 16px; padding: 22px 18px; color: var(--cinza); font-size: 15px; text-align: center; }
.soma { background: var(--respiro); border-radius: 16px; padding: 16px 18px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.soma b { font-family: var(--f-num); font-size: 20px; font-variant-numeric: tabular-nums; }
.bloco { border-top: 1.5px solid var(--areia); padding-top: 18px; display: flex; flex-direction: column; gap: 22px; }
.bloco-titulo { font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--cinza); margin: 0; }
.linhas { display: flex; flex-direction: column; gap: 12px; }
.linha-item { background: var(--branco); border: 1.5px solid var(--areia); border-radius: 14px; padding: 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.linha-item .linha-dupla select, .linha-item .linha-dupla input { min-height: 48px; }
.revisao { display: flex; flex-direction: column; gap: 14px; }
.rev { background: var(--branco); border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; }
.rev-topo { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.rev h2 { font-size: 16px; margin: 0; }
.rev dl { margin: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; font-size: 15px; }
.rev dt { color: var(--cinza); min-width: 0; }
.rev dd { margin: 0; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.aviso { background: var(--areia); border-radius: 16px; padding: 16px 18px; font-size: 15px; display: flex; flex-direction: column; gap: 6px; }
.aviso strong { color: var(--ambar); }
.final { text-align: left; }
.final .cvv { background: var(--branco); border-radius: 16px; padding: 16px 18px; font-size: 15px; }
pre.teste { background: var(--branco); border-radius: 12px; padding: 12px; font-size: 12px; overflow-x: auto; max-height: 60vh; }
.oculto { display: none !important; }
.logo-link { display: inline-flex; color: inherit; }
.erro-envio { background: var(--branco); border-radius: 14px; padding: 14px 16px; color: var(--tinta); font-size: 15px; border-left: 4px solid #9A5B12; }
.btn[disabled] { opacity: .65; cursor: progress; }
.check a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
.protocolo { font-family: "IBM Plex Mono", ui-monospace, monospace; font-weight: 600; letter-spacing: .04em; }
.sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
@media (prefers-reduced-motion: reduce) { .barra > i { transition: none; } }

.cartao .chip.atraso { margin-right: 4px; }
#nova select { min-height: 52px; }
.convite { background: #DCEBE1; color: #16704A; border-radius: 14px; padding: 12px 16px; font-weight: 700; margin: 0 0 14px; }
</style>

  var $t = document.getElementById('tela');
  var TELAS = ['contato', 'renda', 'dividas', 'guardado', 'enviando'];
  var NOMES = ['Você', 'O que entra e o que sai', 'O que você deve', 'Para fechar'];

  function cab() {
    var i = Math.min(E.passo, 3);
    document.getElementById('etapa-nome').textContent = 'Passo ' + (i + 1) + ' de 4 · ' + NOMES[i];
    document.getElementById('barra-i').style.width = Math.max(6, Math.round((E.passo / 4) * 100)) + '%';
    document.getElementById('btn-voltar').style.visibility = E.passo > 0 && E.passo < 4 ? 'visible' : 'hidden';
  }
  function ir(p) { E.passo = p; salvar(); render(); window.scrollTo(0, 0); }
  document.getElementById('btn-voltar').addEventListener('click', function () { if (E.passo > 0) ir(E.passo - 1); });

  function campoDinheiro(id, rotulo, ajuda, val) {
    return '<div class="campo" data-campo="' + id + '"><label for="q-' + id + '">' + rotulo + '</label>' + (ajuda ? '<p class="ajuda">' + ajuda + '</p>' : '') +
      '<div class="dinheiro"><span>R$</span><input id="q-' + id + '" inputmode="numeric" autocomplete="off" placeholder="0" value="' + esc(fmt(val)) + '"></div></div>';
  }
  function erro(id, msg) {
    var el = $t.querySelector('[data-campo="' + id + '"]'); if (!el) return;
    el.classList.add('com-erro'); var p = document.createElement('p'); p.className = 'erro'; p.textContent = msg; el.appendChild(p);
  }
  function limparErros() { $t.querySelectorAll('.erro').forEach(function (x) { x.remove(); }); $t.querySelectorAll('.com-erro').forEach(function (x) { x.classList.remove('com-erro'); }); }
  function ligarDinheiro() {
    $t.querySelectorAll('.dinheiro input').forEach(function (inp) {
      inp.addEventListener('input', function () { var n = num(inp.value); inp.value = n == null ? '' : n.toLocaleString('pt-BR'); });
    });
  }

  function render() {
    cab();
    var t = TELAS[E.passo], r = E.r;
    contar('etapa_r' + t);
    if (t === 'contato') {
      $t.innerHTML = '<section class="tela">' + (E.convite ? '<p class="convite">Link de teste: você recebe a sua data e o plano completo sem pagar nada.</p>' : '') + '<p class="acolhe">Leva uns 5 minutos. Pode responder de cabeça.</p><h1>Vamos descobrir a sua data.</h1>' +
        '<p class="lead">Com valores aproximados, a gente calcula o mês em que você sai das dívidas. É grátis.</p><div class="campos">' +
        '<div class="campo" data-campo="nome"><label for="q-nome">Seu primeiro nome</label><input type="text" id="q-nome" autocomplete="given-name" value="' + esc(r.nome || '') + '"></div>' +
        '<div class="campo" data-campo="email"><label for="q-email">Seu e-mail</label><p class="ajuda">Para mandar a sua data e, se quiser, o plano.</p><input type="email" id="q-email" autocomplete="email" value="' + esc(r.email || '') + '"></div>' +
        '<div class="campo" data-campo="consent"><label class="check"><input type="checkbox" id="q-consent"' + (r.consent ? ' checked' : '') + '><span>Concordo que minhas respostas sejam usadas só para calcular a minha data e montar o meu plano, e apagadas em até 90 dias. Li os <a href="/termos" target="_blank" rel="noopener">termos de uso</a> e a <a href="/privacidade" target="_blank" rel="noopener">política de privacidade</a>.</span></label></div>' +
        '</div><div class="acoes"><button type="button" class="btn btn-principal" id="btn-seguir">Começar</button><p class="nota">Não pedimos CPF, senha nem extrato.</p></div></section>';
      document.getElementById('btn-seguir').addEventListener('click', function () {
        limparErros();
        r.nome = document.getElementById('q-nome').value.trim(); r.email = document.getElementById('q-email').value.trim(); r.consent = document.getElementById('q-consent').checked; salvar();
        var ok = true;
        if (!r.nome) { erro('nome', 'Preencha o seu nome.'); ok = false; }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(r.email)) { erro('email', 'Confira o e-mail. Ele precisa ter o formato nome@exemplo.com.'); ok = false; }
        if (!r.consent) { erro('consent', 'Para calcular, precisamos que você marque que concorda.'); ok = false; }
        if (ok) ir(1);
      });
      return;
    }
    if (t === 'renda') {
      var g = r.gastosR || {};
      $t.innerHTML = '<section class="tela"><h1>O que entra e o que sai</h1><p class="lead">Valores de um mês normal. Um chute bom já serve.</p><div class="campos">' +
        campoDinheiro('renda', 'Quanto cai na sua conta por mês?', 'O salário que entra de fato, já sem os descontos.', r.renda) +
        '<p class="bloco-titulo">Gastos do mês, sem contar as dívidas</p>' +
        campoDinheiro('moradia', 'Aluguel ou condomínio', 'Se não paga, coloque 0.', g.moradia) +
        campoDinheiro('casa', 'Mercado e contas da casa', 'Luz, água, gás, internet, celular e mercado.', g.casa) +
        campoDinheiro('transporte', 'Transporte', 'Ônibus, combustível, aplicativo.', g.transporte) +
        campoDinheiro('resto', 'Todo o resto', 'Farmácia, escola, lanches, roupas, assinaturas, ajuda à família.', g.resto) +
        '</div><div class="acoes"><button type="button" class="btn btn-principal" id="btn-seguir">Continuar</button></div></section>';
      ligarDinheiro();
      document.getElementById('btn-seguir').addEventListener('click', function () {
        limparErros();
        var v = function (id) { return num(document.getElementById('q-' + id).value); };
        r.renda = v('renda'); r.gastosR = { moradia: v('moradia'), casa: v('casa'), transporte: v('transporte'), resto: v('resto') }; salvar();
        var ok = true;
        if (!r.renda) { erro('renda', 'Coloque quanto entra por mês.'); ok = false; }
        ['moradia', 'casa', 'transporte', 'resto'].forEach(function (k) { if (r.gastosR[k] == null) { erro(k, 'Coloque um valor. Se não tiver, coloque 0.'); ok = false; } });
        if (ok) ir(2);
      });
      return;
    }
    if (t === 'dividas') {
      var lista = r.dividas.map(function (d, i) {
        var nome = (TIPOS.filter(function (x) { return x[1] === d.tipo; })[0] || ['Dívida'])[0];
        return '<div class="cartao"><div class="cartao-topo"><div><h2>' + esc(nome) + '</h2><p class="quem">' + (d.atrasada ? '<span class="chip atraso">Atrasada</span> ' : '') + (d.parcela ? 'parcela de ' + reais(d.parcela) : 'sem parcela fixa') + '</p></div><span class="valor">' + reais(d.valor) + '</span></div>' +
          '<div class="cartao-acoes"><button type="button" class="link" data-tirar="' + i + '">Tirar</button></div></div>';
      }).join('');
      $t.innerHTML = '<section class="tela"><h1>O que você deve</h1><p class="lead">Coloque cada dívida com o valor aproximado. Não precisa abrir o app agora.</p>' +
        '<div class="cartoes">' + (lista || '<div class="vazio">Nenhuma dívida ainda. Adicione a primeira abaixo.</div>') + '</div>' +
        '<div class="bloco" id="nova"><p class="bloco-titulo">Adicionar dívida</p>' +
        '<div class="campo" data-campo="tipo"><label for="q-tipo">Tipo</label><select id="q-tipo"><option value="">Escolha</option>' + TIPOS.map(function (x) { return '<option value="' + x[1] + '">' + esc(x[0]) + '</option>'; }).join('') + '</select></div>' +
        campoDinheiro('valor', 'Quanto deve hoje, mais ou menos?', 'No cartão, o valor da fatura mais o que ainda falta das compras parceladas.', null) +
        campoDinheiro('parcela', 'Quanto paga por mês nela?', 'Se não tem parcela fixa (cartão, cheque especial) ou não está pagando, coloque 0.', null) +
        '<div class="campo" data-campo="atrasada"><span class="rotulo">Está atrasada?</span><div class="opcoes lado"><label class="op"><input type="radio" name="atr" value="nao" checked><span>Não</span></label><label class="op"><input type="radio" name="atr" value="sim"><span>Sim</span></label></div></div>' +
        '<button type="button" class="btn btn-sec" id="btn-add">Adicionar esta dívida</button></div>' +
        (r.dividas.length ? '<div class="soma"><span>Total aproximado</span><b>' + reais(r.dividas.reduce(function (s, d) { return s + d.valor; }, 0)) + '</b></div>' : '') +
        '<div class="acoes"><button type="button" class="btn btn-principal" id="btn-seguir">' + (r.dividas.length ? 'Pronto, são essas' : 'Continuar') + '</button></div></section>';
      ligarDinheiro();
      document.getElementById('btn-add').addEventListener('click', function () {
        limparErros();
        var d = { tipo: document.getElementById('q-tipo').value, valor: num(document.getElementById('q-valor').value), parcela: num(document.getElementById('q-parcela').value) || 0,
          atrasada: (document.querySelector('input[name="atr"]:checked') || {}).value === 'sim' };
        var ok = true;
        if (!d.tipo) { erro('tipo', 'Escolha o tipo.'); ok = false; }
        if (!d.valor) { erro('valor', 'Coloque quanto deve, mais ou menos.'); ok = false; }
        if (!ok) return;
        r.dividas.push(d); salvar(); render();
        var n = document.getElementById('nova'); if (n) n.scrollIntoView({ block: 'start' });
      });
      $t.querySelectorAll('[data-tirar]').forEach(function (b) { b.addEventListener('click', function () { r.dividas.splice(Number(b.getAttribute('data-tirar')), 1); salvar(); render(); }); });
      document.getElementById('btn-seguir').addEventListener('click', function () {
        if (!r.dividas.length) { limparErros(); erro('tipo', 'Adicione pelo menos uma dívida.'); return; }
        ir(3);
      });
      return;
    }
    if (t === 'guardado') {
      $t.innerHTML = '<section class="tela"><p class="acolhe">Última pergunta.</p><h1>Para fechar</h1><div class="campos">' +
        campoDinheiro('guardado', 'Você tem algum dinheiro guardado hoje? Quanto, mais ou menos?', 'Se não tem, coloque 0.', r.guardado) +
        '<div class="campo" data-campo="objetivo"><label for="q-objetivo">E quando acabar, o que você quer fazer com esse dinheiro?</label><p class="ajuda">Opcional. Por exemplo: a entrada da casa, uma viagem com a família, voltar a estudar.</p><input type="text" id="q-objetivo" maxlength="120" value="' + esc(r.objetivo || '') + '"></div>' + '</div>' +
        '<div class="acoes"><div id="erro-envio" class="erro-envio oculto" role="alert"></div><button type="button" class="btn btn-principal" id="btn-seguir">Ver a minha data</button><p class="nota">A data é calculada com valores aproximados e é grátis.</p></div></section>';
      ligarDinheiro();
      document.getElementById('btn-seguir').addEventListener('click', function () {
        limparErros();
        r.guardado = num(document.getElementById('q-guardado').value);
        r.objetivo = document.getElementById('q-objetivo').value.trim().slice(0, 120);
        if (r.guardado == null) { erro('guardado', 'Coloque um valor. Se não tiver, coloque 0.'); return; }
        salvar(); enviar();
      });
      return;
    }
    if (t === 'enviando') {
      $t.innerHTML = '<section class="tela"><h1>Calculando...</h1><div class="acoes"><div id="erro-envio" class="erro-envio oculto" role="alert"></div></div></section>';
      enviar();
    }
  }

  // ---------- a estimativa ----------
  // Simula mês a mês: as parcelas seguem, o que sobra vai primeiro para juntar o acordo das atrasadas e depois para a dívida de juro mais alto.
  // Quando uma dívida acaba, a parcela dela passa a ajudar nas outras. Dívida atrasada: acordo estimado em 60% do valor.
  function simular(r, aperto) {
    var hoje = new Date(), ano = hoje.getFullYear(), mes = hoje.getMonth() + 2; if (mes > 12) { mes = 1; ano++; }
    var g = r.gastosR || {}, gastos = (g.moradia || 0) + (g.casa || 0) + (g.transporte || 0) + (g.resto || 0);
    // Como o plano faz: fatura do cartão em aberto e cheque especial viram parcelamento em 12 vezes (juro bem menor).
    var pmt = function (S, i, n) { return i ? S * i / (1 - Math.pow(1 + i, -n)) : S / n; };
    var ds = r.dividas.map(function (d) {
      if (d.atrasada) return { saldo: Math.round(d.valor * 0.6), parcela: 0, taxa: 0, atrasada: true, fim: null };
      if ((d.tipo === 'cartao' || d.tipo === 'cheque') && !d.parcela) { var i = 0.0727 * (aperto ? 1.15 : 1); return { saldo: d.valor, parcela: Math.round(pmt(d.valor, i, 12)), taxa: i, atrasada: false, fim: null }; }
      return { saldo: d.valor, parcela: d.parcela || 0, taxa: taxa(d) * (aperto ? 1.15 : 1), atrasada: false, fim: null };
    });
    var caixa = Math.max(0, (r.guardado || 0) - 500) * 0.8;
    var jurosMes = r.dividas.reduce(function (s, d) { return s + (d.atrasada ? 0 : d.valor * taxa(d)); }, 0);  // o que os juros custam hoje, antes do plano
    var parcelas0 = ds.reduce(function (s, d) { return s + d.parcela; }, 0);
    var sobra0 = (r.renda || 0) - gastos - parcelas0;
    if (sobra0 * (aperto ? 0.85 : 1) <= 0 && caixa < ds.reduce(function (s, d) { return s + d.saldo; }, 0)) return { fecha: false, diferenca: Math.max(0, -sobra0), jurosMes: jurosMes, gastos: gastos };
    var primeira = null;
    for (var k = 0; k < 120; k++) {
      var t = [ano + Math.floor((mes - 1 + k) / 12), (mes - 1 + k) % 12 + 1];
      var pagas = 0;
      ds.forEach(function (d) {
        if (d.fim) return;
        d.saldo *= 1 + d.taxa;
        var p = Math.min(d.parcela, d.saldo); d.saldo -= p; pagas += p;
      });
      var extra = Math.max(0, ((r.renda || 0) - gastos - pagas) * (aperto ? 0.85 : 1)) + caixa; caixa = 0;
      var abertas = ds.filter(function (d) { return !d.fim && d.saldo > 0.5; });
      abertas.sort(function (a, b) { return (b.atrasada - a.atrasada) || (b.taxa - a.taxa); });
      abertas.forEach(function (d) { var v = Math.min(extra, d.saldo); d.saldo -= v; extra -= v; });
      caixa = extra;
      ds.forEach(function (d) { if (!d.fim && d.saldo <= 0.5) { d.fim = t; if (!primeira) primeira = t; } });
      if (ds.every(function (d) { return d.fim; })) return { fecha: true, saida: t, primeira: primeira, jurosMes: jurosMes, gastos: gastos };
    }
    return { fecha: true, saida: null, jurosMes: jurosMes, gastos: gastos };
  }
  function estimativa(r) {
    var a = simular(r, false), b = simular(r, true);
    var total = r.dividas.reduce(function (s, d) { return s + d.valor; }, 0);
    if (!a.fecha) return { tipo: 'lei', aprox: true, diferenca: Math.round(a.diferenca), juros_mes: Math.round(a.jurosMes), dividas: r.dividas.length, total: total };
    if (!a.saida) return { tipo: 'lei', aprox: true, diferenca: 0, juros_mes: Math.round(a.jurosMes), dividas: r.dividas.length, total: total };
    return { tipo: 'data', aprox: true, saida: a.saida, saida_max: (b.fecha && b.saida && (b.saida[0] * 12 + b.saida[1] > a.saida[0] * 12 + a.saida[1])) ? b.saida : null,
      primeira: a.primeira && (a.primeira[0] !== a.saida[0] || a.primeira[1] !== a.saida[1]) ? a.primeira : null, juros_mes: Math.round(a.jurosMes), dividas: r.dividas.length, total: total };
  }

  function enviar() {
    var r = E.r, est = estimativa(r), caixa = document.getElementById('erro-envio'), btn = document.getElementById('btn-seguir');
    if (btn) { btn.disabled = true; btn.textContent = 'Calculando...'; }
    var g = r.gastosR || {};
    var respostas = { rapido: true, consent: true, nome: r.nome, email: r.email, renda: r.renda, guardado: r.guardado || 0, objetivo: r.objetivo || '',
      gastosR: g, dividasR: r.dividas, dividas: r.dividas.map(function (d) { return { tipo: (TIPOS.filter(function (x) { return x[1] === d.tipo; })[0] || ['Outra'])[0] }; }) };
    fetch('/api/respostas', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ respostas: respostas, rapido: true, estimativa: est, teste: TESTE, convite: E.convite || undefined }) })
      .then(function (resp) { return resp.json().then(function (j) { if (!resp.ok || !j.ok) throw new Error(j.erro || 'Não conseguimos enviar agora.'); return j; }); })
      .then(function (j) { E.envio = { id: j.id, pagar: j.pagar }; salvar(); location.href = j.pagar; })
      .catch(function (e) {
        if (btn) { btn.disabled = false; btn.textContent = 'Ver a minha data'; }
        if (caixa) { caixa.textContent = e.message + ' Suas respostas continuam salvas neste aparelho. Confira a internet e tente de novo.'; caixa.classList.remove('oculto'); }
      });
  }

  if (E.passo >= 4) E.passo = 3;
  contar('v_rapido');
  (function () {  // de onde veio, só se não passou pela página inicial nesta visita
    try { if (sessionStorage.getItem('desaperto-ev-v_inicio')) return; } catch (e) {}
    var u = new URLSearchParams(location.search), o = (u.get('utm_source') || '').toLowerCase(), rf = document.referrer;
    var mapa = ['instagram', 'tiktok', 'whatsapp', 'google', 'facebook', 'youtube', 'email'];
    var achou = mapa.filter(function (x) { return o.indexOf(x) >= 0 || (rf && rf.indexOf(x) >= 0) || (x === 'instagram' && o === 'ig'); })[0];
    contar('origem_' + (achou || (o || (rf && rf.indexOf(location.host) < 0) ? 'outro' : 'direto')));
  })();
  render();
})();
</script>
