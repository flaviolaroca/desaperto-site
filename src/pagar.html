<script>
(function () {
  'use strict';
  var q = new URLSearchParams(location.search);
  var id = q.get('id') || '', a = q.get('a') || '';
  var $t = document.getElementById('tela');
  var s = null, timer = null, inicio = Date.now(), etapaG = 0;
  function esc(x) { return String(x == null ? '' : x).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function reais(v) { return 'R$ ' + Math.round(v).toLocaleString('pt-BR'); }
  function contar(e) {
    try { if (localStorage.getItem('desaperto-nao-contar')) return; } catch (er) {}
    try { var k = 'desaperto-ev-' + e; if (sessionStorage.getItem(k)) return; sessionStorage.setItem(k, '1'); } catch (er) {}
    try { navigator.sendBeacon('/api/evento', JSON.stringify({ e: e })); } catch (er) {}
    try { var ab = sessionStorage.getItem('desaperto-ab'); if ((ab === 'a' || ab === 'b') && /^(v_inicio|v_rapido|etapa_r|v_pagar_data|clicou_pix|tempo_10s|faixa_)/.test(e)) navigator.sendBeacon('/api/evento', JSON.stringify({ e: 'ab' + ab + '_' + e })); } catch (er) {}
  }
  // Pixel da Meta: cada evento uma vez por pedido neste aparelho (sem dados da pessoa)
  function VALOR() { try { var v = s && s.preco_txt ? Number(String(s.preco_txt).replace(/[^0-9,]/g, '').replace(',', '.')) : 0; return v > 0 ? v : 34.9; } catch (e) { return 34.9; } }
  function umaVez(nome, fn) {
    if (!window.dpx) return;
    var id = (new URLSearchParams(location.search).get('id') || '').slice(0, 40);
    try { var k = 'desaperto-px-' + nome + '-' + id; if (localStorage.getItem(k)) return; localStorage.setItem(k, '1'); } catch (e) {}
    try { fn(); } catch (e) {}
  }
  var ESCUDO = '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5l-8-3Z" fill="#DCEBE1"/><path d="m8.5 12 2.5 2.5 4.5-5" fill="none" stroke="#16704A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function buscar() {
    return fetch('/api/pagamento?id=' + encodeURIComponent(id) + '&a=' + encodeURIComponent(a), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (!j.ok) throw new Error(j.erro || 'Não encontrado'); s = j; desenhar(); })
      .catch(function (e) { if (!s) falhou(e.message); });
  }
  function falhou(msg) {
    $t.innerHTML = '<p class="rotulo">Seu resultado</p><h1>Este link não funcionou.</h1><p>' + esc(msg) + '</p><p>Se precisar, escreva para contato@desaperto.com.</p>';
  }
  function repetir(ms) { clearTimeout(timer); timer = setTimeout(buscar, ms); }

  function titulo(d, nome) {
    var n = nome ? esc(nome) + ', ' : '';
    if (d.tipo === 'lei') return n + 'a conta não fecha. <em>Mas existe saída.</em>';
    if (d.tipo === 'sem_data') return n + 'as suas contas estão prontas.';
    if (d.aprox) return n + 'você sai das dívidas <em>' + esc(d.faixa_txt || 'por volta de ' + d.saida_txt) + '</em>.';
    return n + (d.carro ? 'vendendo o carro, você sai' : 'você sai') + ' das dívidas em <em>' + esc(d.saida_txt) + '</em>.';
  }
  function notaAprox(d) {
    return d.aprox ? '<p class="aprox">Data aproximada, feita com valores aproximados. O plano exato usa os valores do app do banco e pode mudar essa data.</p>' : '';
  }
  // cartão do story: meses do próximo mês até a saída
  function areaCartao(d) {
    if (!d.saida || !window.DesapertoCartao) return '';
    var h = new Date(Date.now() - 3 * 3600e3), ini = h.getUTCFullYear() * 12 + h.getUTCMonth() + 1, fim = d.saida[0] * 12 + d.saida[1] - 1;
    var total = Math.max(1, fim - ini + 1), M = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
    setTimeout(function () { var el = document.getElementById('area-cartao'); if (el) window.DesapertoCartao.montar(el, { total: total, feitos: 0, pagas: 0, dividas: d.dividas, fim_txt: M[d.saida[1] - 1] + '/' + String(d.saida[0]).slice(2), aprox: d.aprox, objetivo: s.objetivo }, contar); }, 0);
    return '<div id="area-cartao"></div>';
  }
  function numeros(d) {
    var h = '';
    if (d.tipo === 'lei') {
      if (d.diferenca) h += '<div><small>Do jeito que está, falta por mês</small><b>' + reais(d.diferenca) + '</b></div>';
      if (d.parcela) h += '<div><small>Proposta única para os credores, pela Lei do Superendividamento</small><b>' + reais(d.parcela) + ' por mês</b><small>em ' + d.meses + ' parcelas' + (d.saida_txt ? ', terminando em ' + esc(d.saida_txt) : '') + '</small></div>';
    } else if (d.aprox) {
      if (d.primeira_txt) h += '<div><small>A primeira dívida pode acabar já em</small><b>' + esc(d.primeira_txt) + '</b></div>';
      if (d.juros_mes > 20) h += '<div><small>Hoje, só de juros, você paga cerca de</small><b>' + reais(d.juros_mes) + ' por mês</b></div>';
    } else {
      if (d.primeira_txt) h += '<div><small>A primeira dívida acaba já em</small><b>' + esc(d.primeira_txt) + '</b></div>';
      if (d.economia > 50) h += '<div><small>Seguindo a ordem certa, você pode deixar de pagar de juros nos próximos 12 meses</small><b>' + reais(d.economia) + '</b></div>';
    }
    return h ? '<div class="numeros">' + h + '</div>' : '';
  }
  function passoGratis(d) {
    return d.passo ? '<div class="cartao passo-g"><p class="rotulo">Seu primeiro passo, de graça</p><h2>' + esc(d.passo.titulo) + '</h2><p>' + esc(d.passo.texto) + '</p>' + (d.simples ? '' : '<p class="pequeno">O plano completo continua daí: o que fazer em cada mês, até a última dívida.</p>') + '</div>' : '';
  }
  // A ordem das dívidas: a primeira aparece, as outras ficam para o plano completo.
  function ordemTravada(d) {
    if (d.tipo === 'lei' || !d.ordem || d.ordem.length < 2) return '';
    var li = d.ordem.map(function (x, i) {
      if (i === 0) return '<li><span class="pos">1º</span><div><b>' + esc(x.nome) + '</b><small>acaba ' + (d.aprox ? 'por volta de ' : 'em ') + esc(x.fim_txt) + '</small></div></li>';
      return '<li class="trava"><span class="pos">' + (i + 1) + 'º</span><div><b class="borrado" aria-hidden="true">Dívida da sua lista</b><small>no plano completo</small></div></li>';
    }).join('');
    return '<div class="cartao"><h2>A ordem das suas ' + d.ordem.length + ' dívidas</h2><ol class="ordem">' + li + '</ol><p class="pequeno">Pagar na ordem errada é o que faz a dívida durar anos a mais. O plano mostra qual vem depois, quanto pagar em cada uma e em que mês.</p></div>';
  }
  // Aviso de spam, bem visível, para quem pagou: muita gente não acha o e-mail do plano.
  function avisoSpam() {
    return '<div class="aviso-spam"><b>O e-mail pode cair no Spam.</b> Se não aparecer na caixa de entrada em alguns minutos, procure por "Desaperto" no Spam e em Promoções e marque "Não é spam". Ele vem de contato@desaperto.com.</div>';
  }
  // O que a ordem certa muda: pagando como hoje x na ordem certa (só aparece quando a diferença é real).
  function MCURTO(t) { var M = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez']; return t ? M[t[1] - 1] + '/' + t[0] : ''; }
  function htmlComp(c, saida, rs, extra) {
    if (!c || !saida) return '';
    var dif = Math.max(0, (c.juros12_hoje || 0) - (c.juros12_plano || 0));
    var res = [];
    if (dif >= 100) res.push('<em>' + rs(dif) + ' a menos de juros</em> só no primeiro ano');
    if (!c.hoje_saida) res.push('e uma data para acabar');
    else if (c.meses_a_menos >= 2) res.push('e <em>' + c.meses_a_menos + ' meses antes</em>');
    if (!res.length) return '';
    return '<div class="comp"><p class="c-rot">O que a ordem certa muda</p><div class="comp-g">' +
      '<div class="c-hoje"><small>Pagando como hoje</small><b>' + (c.hoje_saida ? MCURTO(c.hoje_saida) : 'mais de 10 anos') + '</b><span>' + rs(c.juros12_hoje) + ' de juros em 12 meses</span></div>' +
      '<div class="c-plano"><small>Na ordem certa</small><b>' + MCURTO(saida) + '</b><span>' + rs(c.juros12_plano) + ' de juros em 12 meses</span></div></div>' +
      '<p class="c-res">' + res.join(' ') + '.</p>' + (extra || '') +
      '<p class="c-nota">"Como hoje": cartão e cheque especial no rotativo, atrasadas sem acordo e um pouco para cada dívida. Estimativa com os seus valores aproximados.</p></div>';
  }
  // Barra fixa embaixo com o preço e o botão, enquanto a caixa de pagamento não está na tela.
  function barraCompra(s) {
    var velha = document.getElementById('barra-compra'); if (velha) velha.remove();
    var b = document.createElement('div'); b.className = 'barra-compra'; b.id = 'barra-compra';
    b.innerHTML = '<div class="bc-p">' + (s.promo ? '<s>' + esc(s.preco_cheio_txt) + '</s>' : '<span style="font-size:.8125rem;opacity:.75">Plano completo</span>') + '<b>' + esc(s.preco_txt) + '</b></div><button type="button">Quero o meu plano</button>';
    document.body.appendChild(b);
    b.querySelector('button').addEventListener('click', function () { contar('barra_compra'); var o = document.querySelector('.oferta'); if (o) o.scrollIntoView({ behavior: 'smooth', block: 'center' }); });
    var alvo = document.querySelector('.oferta');
    function ver() { var r = alvo && alvo.getBoundingClientRect(); var naTela = r && r.top < window.innerHeight && r.bottom > 0; b.classList.toggle('ver', window.scrollY > 200 && !naTela && !!document.getElementById('btn-pix')); }
    window.addEventListener('scroll', ver, { passive: true }); ver();

  // Caso simples (uma dívida que acaba em até 3 meses): honestidade em vez de venda, dicas de negociação e pedido de indicação.
  var LINK_INDICAR = 'https://wa.me/?text=' + encodeURIComponent('Achei um site que mostra em que mês você sai das dívidas e qual pagar primeiro. É grátis e não pede CPF: https://desaperto.com/?utm_source=whatsapp&utm_medium=indicacao');
  function htmlSimples() {
    return '<div class="simples"><p class="s-rot">Boa notícia</p><h2>O seu caso é simples: você não precisa do plano completo.</h2>' +
      '<p>Com uma dívida só, o caminho é negociar bem. Quatro cuidados que valem dinheiro:</p><ol>' +
      '<li><b>Não aceite a primeira proposta.</b> Pergunte o valor à vista e o parcelado, anote e peça um desconto maior. Em dívida atrasada, descontos grandes são comuns.</li>' +
      '<li><b>Pague só por canal oficial:</b> app ou site do banco, da loja ou o Serasa Limpa Nome. Nunca por link de mensagem nem para a conta de uma pessoa.</li>' +
      '<li><b>Só feche o que cabe no mês.</b> Uma parcela que aperta vira outro atraso.</li>' +
      '<li><b>Guarde o comprovante.</b> Depois que você paga, o credor tem 5 dias úteis para tirar o seu nome do cadastro de inadimplentes.</li></ol></div>' +
      '<div class="indicar-box"><h2>Conhece alguém com várias dívidas ao mesmo tempo?</h2><p>Cartão, empréstimo e cheque especial juntos. Para essa pessoa, pagar na ordem certa vale meses. Mande o Desaperto, sem expor ninguém.</p>' +
      '<a class="btn-wpp" id="btn-indicar-s" href="' + LINK_INDICAR + '" target="_blank" rel="noopener">Mandar pelo WhatsApp</a></div>';
  }
  function ligarSimples() {
    var b = document.getElementById('btn-indicar-s'); if (b) b.addEventListener('click', function () { contar('indicou'); });
    var i = document.getElementById('btn-interesse'); if (i) i.addEventListener('click', function () { contar('interesse_depois'); i.outerHTML = '<p class="ok">Anotado. Avisamos no seu e-mail quando estiver pronto.</p>'; });
    var nt = document.getElementById('btn-norte'); if (nt) nt.addEventListener('click', function () { contar('norte_clique'); });
  }
  function inclui(d) {
    var itens = d.tipo === 'lei'
      ? ['O que proteger primeiro: casa, comida e contas.', 'A proposta para os credores, com o valor de cada um.', 'O passo a passo para pedir a renegociação, de graça, no Procon ou na Defensoria Pública.', 'O dossiê pronto para levar: dívidas, orçamento e a proposta.']
      : ['A ordem: qual dívida pagar primeiro e por quê.', 'O mês a mês: quanto pagar, em qual dívida e onde, até a última.', 'O que falar com o banco e quanto oferecer nas dívidas atrasadas.', 'Os seus direitos e o que fazer se um mês apertar.', 'Se você escolheu: um e-mail no começo de cada mês com o que fazer naquele mês.'];
    if (d.aprox) itens.unshift('A data exata: depois de pagar, você completa as respostas com os valores do app do banco, em uns 10 minutos.');
    return '<div class="cartao"><h2>O que vem no plano completo</h2><ul class="inclui">' + itens.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>' +
      '<p class="pequeno"><a href="/exemplo/plano-exemplo.pdf" target="_blank" rel="noopener" id="ver-exemplo">Ver um plano de exemplo (PDF)</a>, feito para uma pessoa fictícia. O seu sai com os seus números.</p></div>';
  }
  function ancora(d) {
    if (d.aprox && d.juros_mes > 20 && s.preco) {
      var dj = Math.ceil(s.preco / (d.juros_mes / 30));
      return dj <= 31 ? '<p class="ancora">Custa menos que ' + (dj <= 1 ? '1 dia' : dj + ' dias') + ' dos juros que você paga hoje.</p>' : '';
    }
    if (!(d.economia > 50) || !s.preco) return '';
    var dias = Math.ceil(s.preco / (d.economia / 365));
    return dias <= 31 ? '<p class="ancora">Custa menos que ' + (dias <= 1 ? '1 dia' : dias + ' dias') + ' dos juros que o plano pode evitar.</p>' : '';
  }

  function desenhar() {
    var d = s.data || {}, nome = s.primeiro_nome;
    var bc0 = document.getElementById('barra-compra'); if (bc0 && s.estado !== 'oferta') bc0.remove();
    clearTimeout(timer);
    if (s.estado === 'gerando') {
      var passou = (Date.now() - inicio) / 1000;
      var ETAPAS = ['Somando as dívidas', 'Ordenando pelos juros', 'Calculando mês a mês', 'Encontrando a sua data'];
      etapaG = Math.min(ETAPAS.length - 1, Math.floor(passou / 12));
      if (passou > 240) {
        $t.innerHTML = '<p class="rotulo">Seu resultado</p><h1>Está demorando mais que o normal.</h1><p>Pode fechar esta página. Assim que as contas ficarem prontas, a sua data chega no e-mail <b>' + esc(s.email) + '</b>.</p><p class="pequeno">Olhe também em Spam e em Promoções.</p>';
        repetir(15000); return;
      }
      $t.innerHTML = '<p class="rotulo">' + (s.pago ? 'Seu plano' : 'Seu resultado') + '</p><h1>' + (nome ? esc(nome) + ', estamos' : 'Estamos') + (s.pago ? ' montando o seu plano.' : ' fazendo as suas contas.') + '</h1><p>Leva cerca de 1 minuto. Não precisa fazer nada.</p>' +
        '<div class="cartao"><div class="barra-c"><i style="width:' + Math.min(92, 8 + passou * 1.1) + '%"></i></div><ul class="etapas-c">' +
        ETAPAS.map(function (x, i) { return '<li' + (i < etapaG ? ' class="feito"' : '') + '>' + x + (i === etapaG ? '...' : '') + '</li>'; }).join('') + '</ul></div>' +
        '<p class="pequeno">Se precisar sair, tudo bem: ' + (s.pago ? 'o plano' : 'a sua data') + ' também chega no e-mail ' + esc(s.email) + '.</p>' + (s.pago ? avisoSpam() : '');
      repetir(3000); return;
    }
    if (s.estado === 'erro') {
      $t.innerHTML = '<p class="rotulo">Seu resultado</p><h1>Não conseguimos terminar as contas.</h1><p>Já fomos avisados. Vamos conferir as suas respostas e escrever para você no e-mail <b>' + esc(s.email) + '</b> em até 24 horas.</p><p class="pequeno">Protocolo ' + esc(s.protocolo) + '</p>';
      return;
    }
    if (s.estado === 'revisao') {
      $t.innerHTML = '<p class="rotulo">Seu resultado</p><h1>Algumas respostas não batem.</h1><p>Antes de mostrar a sua data, conferimos com cuidado para não mostrar um número errado. Você recebe um e-mail em <b>' + esc(s.email) + '</b> em até 24 horas.</p><p class="pequeno">Nada foi cobrado. Protocolo ' + esc(s.protocolo) + '.</p>';
      return;
    }
    if (s.estado === 'completar') {
      $t.innerHTML = '<p class="rotulo">' + (s.gratis ? 'Seu resultado' : 'Pagamento confirmado') + '</p><h1>' + (nome ? esc(nome) + ', agora' : 'Agora') + ', o plano exato.</h1>' +
        '<div class="cartao"><h2>Falta um passo: as respostas completas</h2><p>Separe uns 10 minutos e abra o app do banco. Você confirma o que entra, o que sai e o valor de cada dívida. Assim que terminar, o plano chega no e-mail <b>' + esc(s.email) + '</b> em poucos minutos.</p>' +
        '<a class="btn" href="' + esc(s.continuar) + '">Completar minhas respostas</a><p class="pequeno">Se não der agora, o link também está no seu e-mail.</p></div>' + (s.gratis ? '' : avisoSpam()) +
        (d.saida ? '<div class="numeros"><div><small>Sua data aproximada</small><b>' + esc(d.faixa_txt || d.saida_txt) + '</b></div></div>' : '') + areaCartao(d);
      return;
    }
    if (s.estado === 'devolvido') {
      $t.innerHTML = '<p class="rotulo">Seu plano</p><h1>O pagamento deste plano foi devolvido.</h1><p>Se precisar de alguma coisa, escreva para contato@desaperto.com.</p>';
      return;
    }
    if (s.estado === 'enviado') {
      $t.innerHTML = '<p class="rotulo">' + (s.pago ? 'Pagamento confirmado' : 'Seu plano') + '</p><h1>' + titulo(d, nome) + '</h1>' + numeros(d) +
        '<div class="cartao"><h2>' + (s.pago ? 'Pagamento confirmado. O seu plano foi enviado.' : 'O seu plano já foi enviado.') + '</h2><p>Ele está no e-mail <b>' + esc(s.email) + '</b>, em PDF. Se não achar, escreva para contato@desaperto.com.</p></div>' + avisoSpam() +
        '<div class="cartao"><h2>Por onde começar</h2><p>Abra o PDF na página 3: são três passos para esta semana, com o tempo que cada um leva. Deixe o app do banco à mão.</p></div>' + areaCartao(d);
      return;
    }
    if (s.estado === 'pago') {
      if (!s.gratis) umaVez('compra', function () { window.dpx('Purchase', { value: VALOR(), currency: 'BRL' }); });
      var txt = s.gratis ? 'O seu plano completo está a caminho do e-mail <b>' + esc(s.email) + '</b>. Chega em poucos minutos.'
        : s.revisao ? 'Como a sua conta tem um detalhe que pede atenção, conferimos o plano antes de enviar. Ele chega no e-mail <b>' + esc(s.email) + '</b> em até 24 horas.'
        : 'O seu plano está a caminho do e-mail <b>' + esc(s.email) + '</b>. Chega em poucos minutos.';
      $t.innerHTML = '<p class="rotulo">' + (s.gratis ? 'Seu resultado' : 'Pagamento confirmado') + '</p><h1>' + titulo(d, nome) + '</h1>' + numeros(d) +
        '<div class="cartao"><h2>' + (s.gratis ? 'Pronto.' : 'Pagamento confirmado. Obrigado.') + '</h2><p>' + txt + '</p></div>' + avisoSpam() +
        '<div class="cartao"><h2>Enquanto o e-mail chega</h2><p>Abra o app do banco e deixe à mão. O primeiro passo do plano é para esta semana e leva poucos minutos.</p></div>' + areaCartao(d);
      if (!s.gratis) repetir(8000);
      return;
    }
    if (s.estado === 'oferta') {
      contar('v_pagar_data');
      var ve = document.getElementById('ver-exemplo'); if (ve) ve.addEventListener('click', function () { contar('viu_exemplo'); });
      umaVez('lead', function () { window.dpx('Lead'); });
      if (d.simples) {
        var ofertaS = '<div class="oferta">' + (s.promo ? '<p class="promo-tag">Preço especial · até ' + esc(s.promo_ate_txt) + '</p>' : '') + '<div>' + (s.promo ? '<span class="de">' + esc(s.preco_cheio_txt) + '</span> ' : '') + '<span class="preco">' + esc(s.preco_txt) + '</span></div><p class="sub">Uma vez só, por Pix. Depois de pagar, você completa as respostas e o plano chega no seu e-mail.</p>' +
          '<button type="button" class="btn" id="btn-pix">Pagar ' + esc(s.preco_txt) + ' com Pix</button><div id="erro" class="erro-box" hidden></div></div>';
        $t.innerHTML = '<p class="rotulo">Sua data aproximada</p><h1>' + titulo(d, nome) + '</h1>' + passoGratis(d) + htmlSimples() +
          '<div class="interesse"><h2>Depois que essa dívida acabar</h2><p>O próximo passo é não voltar para o vermelho. O <b>NORTE</b> é um diagnóstico das suas finanças: uma nota de 0 a 10, para onde o dinheiro está escapando e um plano de 3 passos, com valores e prazos. Feito pelo mesmo criador do Desaperto.</p><a class="btn-norte" id="btn-norte" href="https://metodonorte.com.br/?utm_source=desaperto&utm_medium=caso_simples" target="_blank" rel="noopener">Conhecer o NORTE &rarr;</a></div>' +
          '<details class="mesmo-assim"><summary>Mesmo assim, quero o plano completo</summary>' + inclui(d) + ofertaS + '</details>' +
          '<p class="pequeno">Protocolo ' + esc(s.protocolo) + '. A data acima é sua, de graça.</p>';
        ligarSimples();
        document.getElementById('btn-pix').addEventListener('click', gerarPix);
        return;
      }
      $t.innerHTML = '<p class="rotulo">' + (d.aprox ? 'Sua data aproximada' : 'Seu resultado') + '</p><h1>' + titulo(d, nome) + '</h1>' + (d.comp ? htmlComp(d.comp, d.saida, reais, s.preco_txt ? '<p class="c-nota" style="opacity:.9;font-size:.875rem">O plano que mostra essa ordem custa ' + esc(s.preco_txt) + ', uma vez só.</p>' : '') : '') + numeros(d) + notaAprox(d) + passoGratis(d) + ordemTravada(d) + inclui(d) +
        '<div class="oferta">' + (s.promo ? '<p class="promo-tag">Preço especial · até ' + esc(s.promo_ate_txt) + '</p>' : '') + '<div>' + (s.promo ? '<span class="de">' + esc(s.preco_cheio_txt) + '</span> ' : '') + '<span class="preco">' + esc(s.preco_txt) + '</span></div><p class="sub">' + (d.aprox ? 'Uma vez só, por Pix. Sem assinatura. Depois de pagar, você completa as respostas e o plano exato chega no seu e-mail em minutos.' : 'Uma vez só, por Pix. Sem assinatura. O plano chega no seu e-mail em poucos minutos.') + '</p>' + ancora(d) +
        '<button type="button" class="btn" id="btn-pix">Pagar ' + esc(s.preco_txt) + ' com Pix</button><div id="erro" class="erro-box" hidden></div>' +
        '<p class="pequeno">Pagamento pelo Mercado Pago. No seu banco, o recebedor aparece ' + (s.recebedor ? 'como ' + esc(s.recebedor) : 'com o nome do responsável pelo Desaperto') + '. O Desaperto não vê nem guarda dados do seu banco.</p></div>' +
        '<div class="garantia">' + ESCUDO + '<p><b>Garantia de 7 dias.</b> Se o plano não ajudar, responda o e-mail do plano e devolvemos o valor inteiro. Sem perguntas difíceis.</p></div>' +
        '<p class="pequeno">Protocolo ' + esc(s.protocolo) + '. A data acima é sua, de graça, pague ou não.</p>' + areaCartao(d);
      document.getElementById('btn-pix').addEventListener('click', gerarPix);
      barraCompra(s);
      return;
    }
    if (s.estado === 'pix') {
      var p = s.pix, img = p.img ? '<img class="qr" alt="QR code do Pix" src="data:image/png;base64,' + p.img + '">' : '';
      $t.innerHTML = '<p class="rotulo">Pagamento por Pix</p><h1>Falta só o Pix de ' + esc(s.preco_txt) + '.</h1>' +
        '<div class="cartao">' + img + '<h2>Pix copia e cola</h2><textarea class="codigo" id="codigo" readonly>' + esc(p.qr) + '</textarea><button type="button" class="btn" id="btn-copiar">Copiar o código</button>' +
        '<ol class="passos"><li>Abra o app do seu banco e vá em Pix.</li><li>Escolha "Pix copia e cola" e cole o código' + (img ? ', ou leia o QR code com a câmera' : '') + '.</li><li>Confira o valor, ' + esc(s.preco_txt) + ', e o recebedor' + (s.recebedor ? ', <b>' + esc(s.recebedor) + '</b>' : '') + ', e confirme.</li></ol></div>' +
        '<div class="cartao quem-recebe"><h2>Quem aparece no seu banco</h2><p>' + (s.recebedor
          ? 'Na confirmação do Pix, o recebedor aparece como <b>' + esc(s.recebedor) + '</b>, pelo Mercado Pago. É o Desaperto: esse é o nome do responsável pela conta.'
          : 'Na confirmação do Pix, o recebedor aparece com o nome do responsável pelo Desaperto, pelo Mercado Pago. Pode confirmar: somos nós.') +
        '</p><p class="pequeno">O código vale só para este pedido e só para ' + esc(s.preco_txt) + '. Ninguém do Desaperto vai pedir outro pagamento por mensagem.</p></div>' +
        '<div class="cartao"><p class="esperando"><span class="ponto"></span>Esperando o pagamento...</p><p class="pequeno">Assim que o banco confirmar, esta página muda sozinha e o plano vai para o seu e-mail. O código vale até ' + new Date(p.expira).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) + '.</p></div>' +
        '<div class="garantia">' + ESCUDO.replace('#DCEBE1', '#DCEBE1') + '<p><b>Garantia de 7 dias.</b> Se o plano não ajudar, devolvemos o valor.</p></div>';
      document.getElementById('btn-copiar').addEventListener('click', copiar);
      repetir(4000);
      return;
    }
  }

  function gerarPix() {
    var b = document.getElementById('btn-pix'), e = document.getElementById('erro');
    contar('clicou_pix');
    umaVez('pix', function () { window.dpx('InitiateCheckout', { value: VALOR(), currency: 'BRL' }); });
    b.disabled = true; b.textContent = 'Gerando o Pix...'; e.hidden = true;
    fetch('/api/pagamento', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: id, a: a }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (!j.ok) throw new Error(j.erro); s = j; desenhar(); window.scrollTo(0, 0); })
      .catch(function (er) { b.disabled = false; b.textContent = 'Pagar ' + s.preco_txt + ' com Pix'; e.hidden = false; e.textContent = er.message || 'Não conseguimos gerar o Pix. Tente de novo.'; });
  }
  function copiar() {
    var b = document.getElementById('btn-copiar'), t = document.getElementById('codigo');
    contar('copiou_pix');
    var ok = function () { b.textContent = 'Código copiado'; setTimeout(function () { if (b.isConnected) b.textContent = 'Copiar o código'; }, 2500); };
    try { navigator.clipboard.writeText(t.value).then(ok, function () { t.select(); document.execCommand('copy'); ok(); }); }
    catch (er) { t.select(); try { document.execCommand('copy'); ok(); } catch (er2) {} }
  }

  if (!id || !a) { falhou('Abra pelo link do e-mail ou pelo fim do questionário.'); return; }
  buscar();
})();
</script>
